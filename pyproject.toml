[project]
name = "structured-decomposition-swj"
version = "0.1.0"
description = "Structured Decomposition <-> Semantic Web Integration"
readme = "README.md"
authors = [
    { name = "Albert Sadowski", email = "asadowski@mailbox.org" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.49.0",
    "dotenv>=0.9.9",
    "langchain-community>=0.3.20",
    "langchain-google-genai>=2.1.12",
    "langchain-groq>=0.3.8",
    "langchain-mistralai>=0.2.12",
    "langchain[fireworks,openai,anthropic]>=0.3.21",
    "matplotlib>=3.10.8",
    "nltk>=3.9.1",
    "openai>=1.68.2",
    "owlready2>=0.49",
    "pandas>=2.2.3",
    "pydantic>=2.10.6",
    "rdflib>=7.5.0",
    "ruff>=0.14.10",
    "scikit-learn>=1.6.1",
    "scipy>=1.15.0",
    "tqdm>=4.67.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
